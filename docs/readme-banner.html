<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Flow readme banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 2172px;
        height: 724px;
        background: #ffffff;
        overflow: hidden;
      }
      .banner {
        width: 2172px;
        height: 724px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 56px;
        background: #ffffff;
      }
      .mark {
        width: 268px;
        height: 268px;
        flex-shrink: 0;
      }
      .word {
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-weight: 800;
        font-size: 168px;
        letter-spacing: -4px;
        color: #0b1f3a;
        line-height: 1;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <svg class="mark" viewBox="0 0 128 128" aria-hidden="true">
        <!-- Open C-ring, same family as Careero compass-C -->
        <path
          d="M98 28.5a52 52 0 1 0 0 71"
          fill="none"
          stroke="#F5C400"
          stroke-width="16"
          stroke-linecap="round"
        />
        <path
          d="M36 54c14-22 28-22 42 0s28 22 42 0"
          fill="none"
          stroke="#F5C400"
          stroke-width="8"
          stroke-linecap="round"
        />
        <path
          d="M36 76c14-16 28-16 42 0s28 16 42 0"
          fill="none"
          stroke="#F5C400"
          stroke-width="6.5"
          stroke-linecap="round"
        />
      </svg>
      <p class="word">Flow</p>
    </div>
  </body>
</html>
