<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Flow readme banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 2172px;
        height: 724px;
        background: #000000;
        overflow: hidden;
      }
      .banner {
        width: 2172px;
        height: 724px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 48px;
        background: #000000;
      }
      .mark {
        width: 220px;
        height: 220px;
        flex-shrink: 0;
        filter: drop-shadow(0 1px 8px rgba(0, 0, 0, 0.55));
      }
      .word {
        font-family: 'Press Start 2P', monospace;
        font-size: 72px;
        letter-spacing: 28px;
        color: #ffffff;
        -webkit-text-fill-color: #ffffff;
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.75);
        line-height: 1;
        margin: 0;
        padding-right: 8px;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <!-- Same paths as frontend/src/components/FlowLogo.jsx -->
      <svg
        class="mark"
        viewBox="0 0 32 32"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          d="M4 16c4-8 8-8 12 0s8 8 12 0"
          stroke="#ffffff"
          stroke-width="2.5"
          stroke-linecap="round"
        />
        <path
          d="M4 22c4-6 8-6 12 0s8 6 12 0"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
      <p class="word">FLOW</p>
    </div>
  </body>
</html>
